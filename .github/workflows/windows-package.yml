name: Windows package

on:
  workflow_dispatch:
  push:
    branches:
      - feature/windows-packaging
      - "release/**"
    tags:
      - "v*"
    paths:
      - ".github/workflows/windows-package.yml"
      - "CHANGELOG.md"
      - "LICENSE"
      - "README.md"
      - "SBOM.frontend.cdx.json"
      - "THIRD_PARTY_NOTICES.md"
      - "docs/**"
      - "frontend/**"
      - "scripts/build-desktop-frontend.ps1"
      - "scripts/build-wasm.ps1"
      - "scripts/check-package-version.ps1"
      - "scripts/package-source.ps1"
      - "scripts/package-windows.ps1"
      - "scripts/test-windows-package.ps1"
      - "src-tauri/**"
      - "VERSION"
      - "wasm/**"

permissions:
  contents: read
  checks: write
  issues: write

jobs:
  package:
    name: NSIS install and offline solver test
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source and solver
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.56

      - name: Build pinned nec2c WebAssembly
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\build-wasm.ps1 -EmsdkPath $env:EMSDK

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Audit locked Rust dependencies
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.90.0

      - name: Cache Rust build inputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Build Windows NSIS test installer
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\package-windows.ps1 -SkipDependencyInstall

      - name: Test installed application
        shell: powershell
        run: |
          $installer = (Get-ChildItem .\src-tauri\target\release\bundle\nsis\*-setup.exe | Select-Object -First 1).FullName
          & .\scripts\test-windows-package.ps1 -InstallerPath $installer

      - name: Build corresponding-source archive
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\package-source.ps1

      - name: Upload distributable test build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hf-antenna-studio-${{ github.sha }}-windows-x64-test
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/package-manifest.json
            release-artifacts/hf-antenna-studio-*-corresponding-source.zip
            release-artifacts/hf-antenna-studio-*-corresponding-source.zip.sha256
          if-no-files-found: error
          retention-days: 14
