name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "feature/**"
      - "release/**"

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.56

      - name: Build NEC2C WebAssembly artifacts
        working-directory: .
        run: |
          chmod +x wasm/build.sh
          ./wasm/build.sh
          mkdir -p frontend/public/wasm
          cp wasm/build/nec2c.js frontend/public/wasm/
          cp wasm/build/nec2c.wasm frontend/public/wasm/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        env:
          VITE_ENGINE: wasm
        run: npm run build

      - name: Install Chromium for smoke tests
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests
        env:
          HFAS_E2E_SERVER: preview
        run: npm run test:smoke

  rust-security:
    name: Rust dependency audit
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Audit locked Rust dependencies
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri

  windows-baseline:
    name: Windows 11 baseline
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.56

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build NEC2C WebAssembly artifacts
        shell: powershell
        run: >-
          powershell.exe -NoProfile -ExecutionPolicy Bypass
          -File .\scripts\build-wasm.ps1
          -EmsdkPath $env:EMSDK

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Type check
        working-directory: frontend
        run: npm run type-check

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Production Wasm build
        working-directory: frontend
        run: npm run build:wasm

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install chromium

      - name: Browser smoke tests
        working-directory: frontend
        env:
          HFAS_E2E_SERVER: preview
        run: npm run test:smoke:isolated
